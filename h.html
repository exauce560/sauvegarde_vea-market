<!-- Exemple de rendu visuel de la notification (Style iOS / Android moderne) -->
<div style="
  max-width: 380px;
  background-color: #ffffff;
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.12);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  border: 1px solid #eef0f2;
">
  <!-- En-tête : Nom de l'application & Heure -->
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Logo avec bords arrondis professionnels -->
      <img src="favicon.ico" alt="Vea Market" style="width: 20px; height: 20px; border-radius: 5px; object-fit: cover;">
      <span style="font-size: 13px; font-weight: 600; color: #1c1c1e; letter-spacing: -0.2px;">Vea Market</span>
    </div>
    <span style="font-size: 11px; color: #8e8e93;">Maintenant</span>
  </div>

  <!-- Corps de la notification -->
  <div>
    <div style="font-size: 14px; font-weight: 600; color: #000000; margin-bottom: 3px;">
      Nouveau produit chez Kwitonda !
    </div>
    <div style="font-size: 13px; color: #3a3a3c; line-height: 1.35;">
      La boutique Kwitonda vient de publier : "Perruque noire".
    </div>
  </div>
</div>
